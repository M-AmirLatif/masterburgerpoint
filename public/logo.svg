<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" width="100%" height="100%">
  <defs>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Left: Black Circular Mascot Emblem (Chef & Burger) -->
  <g transform="translate(6, 4)">
    <!-- Outer Black Circle -->
    <circle cx="36" cy="36" r="36" fill="#141414" stroke="#FFC20E" stroke-width="2.5" />
    <!-- White Inner Rim Arc -->
    <path d="M12 28 A 28 28 0 0 1 60 28" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Chef Character Inside Circle -->
    <!-- Chef Hat -->
    <path d="M25 19 C21 19 19 16 20 13 C21 9 26 8 28 10 C31 6 38 6 41 10 C44 8 49 9 50 13 C51 16 49 19 45 19 Z" fill="#FFFFFF" stroke="#141414" stroke-width="1.2" />
    <path d="M25 19 L45 19 L44 24 L26 24 Z" fill="#FFFFFF" stroke="#141414" stroke-width="1.2" />
    <line x1="28" y1="21.5" x2="42" y2="21.5" stroke="#FFC20E" stroke-width="1.5" />

    <!-- Head / Face -->
    <path d="M28 23 C28 20 42 20 42 23 L42 29 C42 34 38 37 35 37 C32 37 28 34 28 29 Z" fill="#FCD34D" />
    <!-- Beard & Hair -->
    <path d="M27 24 C26 27 27 34 31 37 C33 38.5 37 38.5 39 37 C43 34 44 27 43 24 C41 27 39 28 35 28 C31 28 29 27 27 24 Z" fill="#1E1E1E" />
    <!-- Mustache -->
    <path d="M30 30 C32 29 35 31 35 31 C35 31 38 29 40 30 C41 31 40 33 38 32.5 C36 32 35 33 35 33 C35 33 34 32 32 32.5 C30 33 29 31 30 30 Z" fill="#1E1E1E" />
    <!-- Eyes & Brows -->
    <circle cx="32" cy="26" r="1" fill="#1E1E1E" />
    <circle cx="38" cy="26" r="1" fill="#1E1E1E" />

    <!-- Chef Yellow Uniform Coat -->
    <path d="M22 41 C24 37 28 36 35 36 C42 36 46 37 48 41 L52 50 L18 50 Z" fill="#FFC20E" stroke="#141414" stroke-width="1" />
    <!-- Coat Buttons -->
    <circle cx="33" cy="40" r="0.9" fill="#141414" />
    <circle cx="37" cy="40" r="0.9" fill="#141414" />
    <circle cx="33" cy="44" r="0.9" fill="#141414" />
    <circle cx="37" cy="44" r="0.9" fill="#141414" />

    <!-- Food Tray in Hands -->
    <ellipse cx="35" cy="48" rx="20" ry="3.5" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="0.8" />
    <!-- Burger on Tray -->
    <path d="M26 47 C26 43 33 43 33 47 Z" fill="#F59E0B" />
    <rect x="25.5" y="47" width="8" height="1.5" rx="0.5" fill="#78350F" />
    <rect x="26" y="48.5" width="7" height="1" rx="0.5" fill="#FBBF24" />
    <!-- Drink with straw -->
    <rect x="40" y="43" width="5" height="6.5" rx="1" fill="#EF4444" />
    <line x1="42.5" y1="43" x2="44.5" y2="39" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
    <!-- French Fries box -->
    <path d="M34 45 L39 45 L38 49 L35 49 Z" fill="#DC2626" />
    <line x1="35" y1="45" x2="35" y2="42" stroke="#FDE047" stroke-width="1" />
    <line x1="36.5" y1="45" x2="36.5" y2="41" stroke="#FDE047" stroke-width="1" />
    <line x1="38" y1="45" x2="38" y2="42.5" stroke="#FDE047" stroke-width="1" />

    <!-- Curved banner at bottom -->
    <path d="M16 57 C22 62 48 62 56 57 L54 64 C46 68 24 68 18 64 Z" fill="#8B1A1A" stroke="#FFC20E" stroke-width="0.8" />
    <text x="36" y="62.5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">KASUR</text>
  </g>

  <!-- Right: Wordmark "Master Burger Point" -->
  <g transform="translate(86, 0)">
    <!-- Crown icon on Master -->
    <g transform="translate(4, 6) scale(0.65)">
      <path d="M2 14 L7 4 L14 10 L21 4 L26 14 Z" fill="#FFC20E" stroke="#8B1A1A" stroke-width="1.2" />
      <circle cx="2" cy="14" r="1.5" fill="#8B1A1A" />
      <circle cx="7" cy="4" r="1.5" fill="#8B1A1A" />
      <circle cx="14" cy="10" r="1.5" fill="#8B1A1A" />
      <circle cx="21" cy="4" r="1.5" fill="#8B1A1A" />
      <circle cx="26" cy="14" r="1.5" fill="#8B1A1A" />
    </g>

    <!-- Wordmark "MASTER" -->
    <text x="26" y="36" font-family="'Lilita One', 'Impact', cursive" font-size="34" font-weight="900" fill="#141414" letter-spacing="0.5">
      MASTER
    </text>

    <!-- Wordmark "BURGER POINT" -->
    <text x="26" y="58" font-family="'Lilita One', 'Impact', cursive" font-size="22" font-weight="900" fill="#8B1A1A" letter-spacing="0.8">
      BURGER POINT
    </text>

    <!-- Burger icon next to Burger Point -->
    <g transform="translate(182, 42) scale(0.7)">
      <path d="M2 10 C2 4 18 4 18 10 Z" fill="#FFC20E" stroke="#8B1A1A" stroke-width="1.2" />
      <rect x="1.5" y="10" width="17" height="3" rx="1" fill="#8B1A1A" />
      <path d="M2 13 C2 16 18 16 18 13 Z" fill="#F59E0B" stroke="#8B1A1A" stroke-width="1" />
    </g>

    <!-- Subtitle: Oldest Shop in Kasur -->
    <text x="26" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8.5" fill="#5C4E4B" letter-spacing="0.4">
      THE OLDEST &amp; BEST BURGER SHOP IN KASUR
    </text>
  </g>
</svg>
