  <circle cx="48" cy="54" r="1.2" fill="#141414" />
  <circle cx="52" cy="54" r="1.2" fill="#141414" />
  <circle cx="48" cy="60" r="1.2" fill="#141414" />
  <circle cx="52" cy="60" r="1.2" fill="#141414" />

  <!-- Food Tray -->
  <ellipse cx="50" cy="65" rx="28" ry="4.5" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1" />
