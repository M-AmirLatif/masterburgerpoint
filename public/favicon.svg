  <line x1="40" y1="29.5" x2="60" y2="29.5" stroke="#FFC20E" stroke-width="2" />

  <!-- Head / Face -->
  <path d="M40 32 C40 28 60 28 60 32 L60 41 C60 47 55 51 50 51 C45 51 40 47 40 41 Z" fill="#FCD34D" />
